# The server, where the app runs as a packaged jar (see the README's Deploying). Settings that are secret or vary, such
# as the API key, come from the environment.

# Only a proxy on this machine reaches the app.
server.address=127.0.0.1

# The packaged jar has no Docker Compose support, so the database is configured here: the Compose Postgres, on the
# fixed port deploy/compose.production.yaml gives it. Only this machine can connect to it.
spring.r2dbc.url=r2dbc:postgresql://127.0.0.1:5432/skystream_db
spring.r2dbc.username=local_user
spring.r2dbc.password=local_password

skystream.search.enabled=true
# Where deploy.sh fetches it, in the root-owned checkout.
skystream.search.model-dir=/opt/skystream/app/models/embeddinggemma-300m

spring.application.name=skystream
spring.sql.init.mode=always

# The search rate limit reads X-Forwarded-For itself, trusting it only from this machine (Clients). Netty mustn't rewrite
# the client's address from Forwarded headers, which Spring Boot would turn on by itself on a detected cloud platform.
server.forward-headers-strategy=none

# Disable for tests or database-only operation.
skystream.jetstream.enabled=true

# Caffeine logs each failed cache load with a stack trace; QueryExpander already logs the failure, timeouts included.
logging.level.com.github.benmanes.caffeine.cache.LocalAsyncCache=error

# Metrics for Prometheus, on a port of their own that only this machine can reach.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
# Latency buckets for the search timers, so percentiles can be graphed: a few series each, not a full histogram.
management.metrics.distribution.slo.skystream.search=250ms,500ms,1s,2s,3s,5s,10s,20s

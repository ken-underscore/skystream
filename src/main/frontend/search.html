<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search · Skystream</title></head>
<body><main>
  <header class="top"><a class="brand" href="./">Skystream</a><nav><a href="./">Words</a><a href="search.html" aria-current="page">Search</a></nav></header>
  <div class="intro">
    <p class="eyebrow">Search · last 24 hours</p>
    <h1>Search posts by meaning</h1>
    <form class="search" role="search">
      <input id="q" name="q" type="search" required pattern=".*\S.*" maxlength="200" autocomplete="off" placeholder="Try semantic search against recent bluesky posts" aria-label="Search posts by meaning">
      <button>Search</button>
    </form>
    <p id="error" role="alert" hidden></p>
  </div>
  <section id="answer" class="summary" aria-labelledby="answer-title" hidden>
    <h2 id="answer-title">Generated summary</h2>
    <p id="answer-text" aria-live="polite"></p>
  </section>
  <p id="result-status" role="status"></p>
  <ol id="results" class="results"></ol>
</main><script type="module" src="/src/search-page.ts"></script></body>
</html>

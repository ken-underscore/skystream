<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Skystream</title></head>
<body><main>
  <header class="top"><a class="brand" href="./">Skystream</a><nav><a href="./" aria-current="page">Words</a><a href="search.html">Search</a><a id="mode" href="?demo=1">Demo</a></nav></header>
  <div class="intro">
    <p class="eyebrow">Bluesky · English posts</p>
    <h1>The words Bluesky is using most in the last <select id="snapshot" aria-label="Time window"></select></h1>
    <form class="search" action="search.html" role="search">
      <input name="q" type="search" required pattern=".*\S.*" maxlength="200" autocomplete="off" placeholder="Try semantic search against recent bluesky posts" aria-label="Search posts by meaning">
      <button>Search</button>
    </form>
    <p class="meta"><span id="status" role="status">Connecting…</span><span id="updated"></span><label>Refresh <select id="refresh"></select></label></p>
    <p id="collected" class="note" hidden></p>
    <p id="error" role="alert" hidden></p>
  </div>
  <div class="colhead" aria-hidden="true"><span>#</span><span>Word</span><span></span><span>Uses</span></div>
  <ol id="chart" class="chart"></ol>
  <p id="empty" class="note">Waiting for the first snapshot…</p>
  <footer><span>Top 50 words · English posts · common words left out</span><span>Click a word to search it on Bluesky</span></footer>
</main><script type="module" src="/src/main.ts"></script></body>
</html>

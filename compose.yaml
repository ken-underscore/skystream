services:
  postgres-db:
    image: pgvector/pgvector:pg17
    container_name: skystream_postgres_local
    labels:
      # Spring Boot recognizes the postgres image by name, but not pgvector's.
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: skystream_db
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

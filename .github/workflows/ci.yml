name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Database tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - run: ./mvnw -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs pnpm from package.json's devEngines, Node, and the locked dependencies.
      - uses: pnpm/setup@v3
        with:
          working-directory: src/main/frontend
          runtime: node@22
          cache: true
      # Type-checks with tsc before the Vite build.
      - run: pnpm build
        working-directory: src/main/frontend
